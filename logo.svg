<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32" viewBox="0 0 32 32"
     role="img" aria-label="TEXBIT logo">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302b29"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2523a2"/>
      <stop offset="0.55" stop-color="#211ca0"/>
      <stop offset="1" stop-color="#24208d"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfc1c7"/>
      <stop offset="0.48" stop-color="#f5f5f6"/>
      <stop offset="1" stop-color="#b9bbc2"/>
    </linearGradient>
  </defs>

  <!-- Outer dark rounded-square background -->
  <rect x="0" y="0" width="32" height="32" rx="3.1" fill="url(#outer)"/>

  <!-- Deep-blue rounded-square field -->
  <rect x="4.05" y="1.95" width="25.55" height="27.65"
        rx="6.15" fill="url(#blue)"/>

  <!-- Silver rounded rectangle at the center -->
  <rect x="9.05" y="10.05" width="15.5" height="11.15"
        rx="1.55" fill="url(#silver)"/>

  <!-- Dark navy V mark -->
  <path d="M11.55 12.45 L16.78 16.58 L22.08 12.45"
        fill="none" stroke="#073477" stroke-width="1.75"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
